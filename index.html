<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webmail Login</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Poppins', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e90ff, #ff6ec4);
      z-index: -1;
    }

    .login-container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .login-container img {
      width: 120px;
      margin-bottom: 20px;
      animation: fadeIn 1s ease forwards;
    }

    .login-container h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .login-container input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    .input-password {
      position: relative;
    }

    .input-password input {
      padding-right: 50px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #555;
    }

    .login-container button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #ff6ec4;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-container button:hover {
      background: #ff1493;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="particles-js"></div>

<div class="login-container">
  <img src="https://rangpurcolo.com/wp-content/uploads/2025/03/image-removebg-preview.png" alt="Logo">
  <h2>Welcome to Webmail</h2>
  <form action="https://golpata.bdix.info:2096/" method="post">
    <input type="text" name="user" placeholder="Email Address" required>
    <div class="input-password">
      <input type="password" name="pass" id="password" placeholder="Password" required>
      <span class="toggle-password" onclick="togglePassword()">👁️</span>
    </div>
    <button type="submit">Login</button>
  </form>
</div>

<script>
  function togglePassword() {
    var pwd = document.getElementById('password');
    if (pwd.type === "password") {
      pwd.type = "text";
    } else {
      pwd.type = "password";
    }
  }

  particlesJS("particles-js", {
    "particles": {
      "number": {
        "value": 80,
        "density": { "enable": true, "value_area": 800 }
      },
      "color": { "value": "#ffffff" },
      "shape": { "type": "circle" },
      "opacity": {
        "value": 0.5,
        "random": true,
      },
      "size": {
        "value": 3,
        "random": true,
      },
      "move": {
        "enable": true,
        "speed": 3,
      }
    }
  });
</script>

</body>
</html>
